<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meon Hall Share</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#6d4aff">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg1:#6ab7ff;--bg2:#bfe6ff;--bg3:#8ed15a;--card:#f6f0e4;--tx:#2a1f14;--mu:#75654f;--bd:#3b2a1a;--inp:#fffaf0;--ac:#4caf2a;--ac2:#e6dcc6;--bub:#ece3d0;--btn:#bdbdbd;--btx:#222}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0a0f2a;--bg2:#1c2b52;--bg3:#173a1e;--card:#2c2c34;--tx:#ececf4;--mu:#a7a7b8;--bd:#000;--inp:#1d1d24;--ac:#5fc13a;--ac2:#3a3a46;--bub:#383844;--btn:#6e6e78;--btx:#fff}}
:root[data-theme="dark"]{--bg1:#0a0f2a;--bg2:#1c2b52;--bg3:#173a1e;--card:#2c2c34;--tx:#ececf4;--mu:#a7a7b8;--bd:#000;--inp:#1d1d24;--ac:#5fc13a;--ac2:#3a3a46;--bub:#383844;--btn:#6e6e78;--btx:#fff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2) 45%,var(--bg3)) fixed;color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));min-height:100vh}
.px,.brand,.stat b,h2,h3{font-family:'Press Start 2P','Courier New',monospace}
.cloud{position:fixed;top:110px;left:-160px;width:70px;height:22px;background:#fff;opacity:.75;box-shadow:22px -16px 0 #fff,44px -16px 0 #fff,66px 0 0 #fff,-22px 6px 0 #fff;animation:drift 70s linear infinite;pointer-events:none;z-index:0}
.cloud.c2{top:240px;animation-duration:110s;animation-delay:-50s;transform:scale(.7)}
@keyframes drift{to{left:110%}}
header,.stats,main{position:relative;z-index:1}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:14px 14px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#5db83b 0 8px,#3b8f1f 8px 12px,#8b5a2b 12px);border-bottom:4px solid #3b2a1a}
header:after{content:"";position:absolute;inset:12px 0 0;background:repeating-conic-gradient(rgba(0,0,0,.09) 0 25%,transparent 0 50%) 0 0/16px 16px;pointer-events:none}
header>*{position:relative;z-index:1}
.brand{flex:1;font-size:12px;color:#fff;text-shadow:2px 2px 0 #3a2a18;display:flex;align-items:center}
.brand img{transition:transform .3s}.brand:hover img{transform:rotate(-12deg) scale(1.15)}
.stats{display:flex;gap:8px;padding:14px;max-width:1000px;margin:auto}
.stat{flex:1;background:var(--card);border:3px solid var(--bd);padding:8px 6px;text-align:center;box-shadow:4px 4px 0 rgba(0,0,0,.25);transition:transform .2s}
.stat:hover{transform:translateY(-3px)}
.stat b{display:block;font-size:13px;margin-bottom:4px}.stat span{color:var(--mu);font-size:11px}
.dot{display:inline-block;width:9px;height:9px;background:#3ddc4b;margin-right:5px;animation:ping 1.6s infinite}
@keyframes ping{50%{box-shadow:0 0 0 5px #3ddc4b44;opacity:.7}}
main{max-width:1000px;margin:auto;padding:0 14px}
button,.btn{font:inherit;font-weight:700;cursor:pointer;border:3px solid var(--bd);background:var(--btn);color:var(--btx);border-radius:0;padding:7px 14px;white-space:nowrap;box-shadow:inset -3px -3px 0 rgba(0,0,0,.28),inset 3px 3px 0 rgba(255,255,255,.5);transition:transform .12s,filter .12s}
button:hover,.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}
button:active,.btn:active{transform:translateY(2px) scale(.97);box-shadow:inset 3px 3px 0 rgba(0,0,0,.3)}
.pri,.tab.on{background:var(--ac);color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.45)}
.tab.on{animation:glow 2.2s infinite}@keyframes glow{50%{box-shadow:inset -3px -3px 0 rgba(0,0,0,.28),inset 3px 3px 0 rgba(255,255,255,.5),0 0 12px var(--ac)}}
.dng{background:#d9453b;color:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 12px}
input,textarea,select{font:inherit;width:100%;padding:9px 11px;border:3px solid var(--bd);border-radius:0;background:var(--inp);color:var(--tx);margin:4px 0 10px;box-shadow:inset 3px 3px 0 rgba(0,0,0,.12);transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #4caf2a55}
label{font-size:13px;color:var(--mu);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card,.box{background:var(--card);border:3px solid var(--bd);box-shadow:4px 4px 0 rgba(0,0,0,.25)}
.card{cursor:pointer;overflow:hidden;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:8px 10px 0 rgba(0,0,0,.28)}
.th{aspect-ratio:16/9;background:repeating-conic-gradient(#6fb94a 0 25%,#5aa03a 0 50%) 0 0/24px 24px;display:flex;align-items:center;justify-content:center;font-size:34px;border-bottom:3px solid var(--bd)}
.th[style*=url]{background-size:cover;background-position:center}
.cb{padding:10px 12px}.cb h3{margin:0 0 6px;font-size:11px;line-height:1.5}
.cb p{margin:0 0 8px;color:var(--mu);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt{display:flex;gap:10px;color:var(--mu);font-size:12px;align-items:center;flex-wrap:wrap}
.box{padding:14px;margin-bottom:14px}h2{font-size:14px}h3{font-size:12px;line-height:1.6}
.badge{font-size:10px;color:#fff;padding:1px 7px;margin-left:5px;font-weight:700;border:2px solid rgba(0,0,0,.45);background-image:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);background-size:250% 100%;animation:shine 3s infinite}
@keyframes shine{from{background-position:150% 0}to{background-position:-50% 0}}
.un{color:var(--mu);font-size:12px;margin-left:4px}
.av{width:22px;height:22px;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;background:var(--ac);color:#fff;font-size:11px;font-weight:700;margin-right:6px;vertical-align:middle;border:2px solid var(--bd);flex:none}
.big .av{width:64px;height:64px;font-size:26px;border-width:3px}
.prof .pb{height:60px;margin:-14px -14px 0;background:linear-gradient(135deg,#5db83b,#2f8bd6);border-bottom:3px solid var(--bd)}
nav.bot{position:fixed;left:0;right:0;bottom:0;background:#6f6f6f;border-top:5px solid #5db83b;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.bot button{flex:1;border:0;background:none;box-shadow:none;font-size:11px;padding:6px 2px;color:#ddd;transition:transform .15s}
nav.bot button.on{color:#fff;text-shadow:1px 1px 0 #000}nav.bot button.on span{animation:bob 1.2s ease-in-out infinite}
nav.bot span{display:block;font-size:21px}@keyframes bob{50%{transform:translateY(-4px)}}
.bg{position:fixed;inset:0;background:#000a;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--card);border:3px solid var(--bd);width:100%;max-width:660px;max-height:92%;display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:3px solid var(--bd);background:var(--ac2)}
.mh b{font-family:'Press Start 2P','Courier New',monospace;font-size:11px;line-height:1.5}
.mb{flex:1;min-height:0;overflow-y:auto;padding:14px}
.mc{border-top:3px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ac2)}
@media(min-width:700px){.bg{align-items:center}}
.cm{display:flex;gap:8px;margin:10px 0}.cm .av{width:34px;height:34px;font-size:15px;margin:0}
.cm.rp{margin-left:30px;padding-left:8px;border-left:4px solid var(--ac)}
.bub{flex:1;background:var(--bub);border:2px solid var(--bd);padding:7px 10px;word-break:break-word}.bub .tx{margin:3px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sm{font-size:12px;padding:3px 10px}
.muted{color:var(--mu)}.empty{text-align:center;color:var(--mu);padding:40px 0}
.fx .card{animation:cardIn .45s both;animation-delay:calc(var(--i,0)*45ms)}.fx .box,.fx .stat{animation:cardIn .4s both}
.fx .md{animation:slideUp .3s cubic-bezier(.2,.9,.3,1.15)}.fx .bg{animation:fade .2s}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}}@keyframes slideUp{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.chip{display:inline-block;font-size:11px;background:var(--ac2);border:2px solid var(--bd);padding:0 6px;margin:0 4px 6px 0;cursor:pointer;transition:transform .12s}.chip:hover{transform:translateY(-2px)}
.lk{cursor:pointer}.lk:hover{text-decoration:underline}
nav.bot span{position:relative}.nbd{font-style:normal;position:absolute;top:-4px;right:-10px;background:#e11d48;color:#fff;font-size:10px;padding:0 5px;border:2px solid #000;animation:ping 1.6s infinite}
.msg{display:flex;margin:6px 0}.msg.me{justify-content:flex-end}.mb2{max-width:80%;background:var(--bub);border:2px solid var(--bd);padding:6px 10px;word-break:break-word}.msg.me .mb2{background:var(--ac);color:#fff}.mb2 .t{font-size:10px;opacity:.7;text-align:right}
.nw{border-color:var(--ac);box-shadow:4px 4px 0 var(--ac)}
.wl{border-left:6px solid var(--ac)}
@media(max-width:460px){.brand{font-size:10px}.brand img{width:24px!important;height:24px!important;margin-right:5px!important}header{gap:6px}}
.th.blur{position:relative;isolation:isolate;overflow:hidden;color:#fff;font-size:40px}.th.blur:before{content:"";position:absolute;inset:0;background:inherit;filter:blur(8px) brightness(.55);transform:scale(1.15);z-index:-1}
</style></head><body>
<div class="cloud"></div><div class="cloud c2"></div>
<div id="app"></div>
<script>
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={users:{},posts:[],comments:[],saves:{},peers:0,visits:0,me:null,tab:'new',page:'home',open:null,edit:null,q:'',modal:null,mode:'in',err:'',draft:{cat:'addon'},reply:null,dbOk:null,followers:[],fq:'',ft:'all',mine:null,packages:[],txns:[],mytops:[],pend:[],pamt:'',pid:0,purl:'',topAmt:'',topProof:'',ad:null,anim:true,ctext:'',scrollEnd:false,following:[],fcount:{},gcount:{},notifs:[],notifNew:null,unreadN:0,unreadM:0,reports:[],convs:[],thread:null,cu:null,mtext:'',vu:'',sort:'new',ver:''};
let assets=true,sb=null,dirty=false,sid=Math.random().toString(36).slice(2);

const CATS={addon:'Addon',texture:'Texture',survival:'Survival',world:'World',client:'Client',file:'File',hadiah:'Hadiah',lain:'Lainnya'};
const VOPT=[['','VIP: tidak diubah'],['0','Cabut VIP'],['7','VIP 7 hari'],['30','VIP 30 hari'],['365','VIP 1 tahun'],['-1','VIP permanen']];
const BOPT=[['','Ban: tidak diubah'],['0','Cabut ban'],['60','Ban 1 jam'],['1440','Ban 1 hari'],['10080','Ban 7 hari'],['43200','Ban 30 hari'],['-1','Ban permanen']];
const opts=a=>a.map(([v,t])=>`<option value="${v}">${t}</option>`).join('');
const SOC=[['yt','▶️','YouTube'],['tt','🎵','TikTok'],['ig','📷','Instagram'],['dc','💬','Discord'],['fb','📘','Facebook'],['x','✖️','X / Twitter']];
const TABS=[['new','Terbaru'],['hot','Populer'],['follow','Mengikuti'],['top','🏆 Top'],['hadiah','Hadiah'],['saved','Tersimpan'],['addon','Addon'],['texture','Texture'],['survival','Survival'],['world','World'],['client','Client'],['file','File']];
const me=()=>S.users[S.me];const isAdm=()=>me()&&['owner','admin'].includes(me().role);
function tagOf(n){const u=S.users[n];if(!u)return'';const t=u.tagText?{t:u.tagText,c:u.tagColor||'#6d4aff'}:u.role==='owner'?{t:'Owner',c:'#e11d48'}:u.role==='admin'?{t:'Admin',c:'#2563eb'}:null;let h=t?`<span class="badge" style="background:${E(t.c)}">${E(t.t)}</span>`:'';if(u.vipUntil>Date.now()&&!/^vip$/i.test(u.tagText||''))h+='<span class="badge" style="background:#d4a017">⭐ VIP</span>';if(u.bannedUntil>Date.now())h+='<span class="badge" style="background:#555">🚫 Ban</span>';return h}
const av=n=>{const u=S.users[n];return u&&u.avatar?`<img class="av" src="${E(u.avatar)}" alt="">`:`<span class="av">${E((n||'?')[0]).toUpperCase()}</span>`};
const rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');const rk=n=>n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'jt':n>=1000?Math.floor(n/1000)+'rb':String(n||0);
const dn=n=>(S.users[n]&&S.users[n].display)||n;
const nm=n=>`<b class="lk" data-act="user" data-id="${E(n)}">${E(dn(n))}</b><span class="un">@${E(n)}</span>${tagOf(n)}`;
const uname=n=>av(n)+nm(n);
const ago=t=>new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});

function need(){if(!S.me||!me()){S.modal='auth';S.mode='in';S.err='Masuk dulu untuk melakukan aksi ini.';render(true);return false}return true}

function list(){let l=[...S.posts];const q=S.q.toLowerCase().replace(/^#/,'');
 if(CATS[S.tab])l=l.filter(p=>p.cat===S.tab);
 if(S.tab==='saved')l=l.filter(p=>((S.saves[S.me]||{}).ids||[]).includes(p.id));
 if(S.tab==='follow')l=l.filter(p=>S.following.includes(p.author));
 if(S.ver)l=l.filter(p=>p.gver===S.ver);
 if(q)l=l.filter(p=>(p.title+' '+p.desc+' '+(p.tags||[]).join(' ')).toLowerCase().includes(q));
 const sc={hot:p=>(p.likes||[]).length*3+p.views,dl:p=>p.dl||0,like:p=>(p.likes||[]).length},k=S.tab==='hot'?'hot':S.sort;
 l.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(sc[k]?sc[k](b)-sc[k](a):b.ts-a.ts));return l}
function card(p,i){return`<div class="card" style="--i:${Math.min(i,12)}" data-act="${p.locked?'vipgate':'open'}" data-id="${p.id}"><div class="th ${p.locked?'blur':''}" style="${p.thumb?`background-image:url('${E(p.thumb)}')`:''}">${p.locked?'🔒':p.thumb?'':'📦'}</div><div class="cb"><h3>${p.pinned?'📌 ':''}${E(p.title)}</h3><p>${p.locked?'🔒 Konten khusus VIP':E(p.desc)}</p><div>${p.gver?`<span class="chip">🎮 ${E(p.gver)}</span>`:''}${(p.tags||[]).slice(0,3).map(t=>`<span class="chip" data-act="tag" data-id="${E(t)}">#${E(t)}</span>`).join('')}</div><div class="mt"><span>❤ ${(p.likes||[]).length}</span><span>👁 ${p.views||0}</span><span>⬇ ${p.dl||0}</span><span>${CATS[p.cat]||''}</span>${p.vip?'<span>🔒 VIP</span>':''}${p.hidden?'<span>🙈 Disembunyikan</span>':''}</div><div class="mt" style="margin-top:6px">${uname(p.author)}</div></div></div>`}
function topPage(){const m={};S.posts.forEach(p=>{const x=m[p.author]||(m[p.author]={n:p.author,l:0,d:0,c:0});x.l+=(p.likes||[]).length;x.d+=p.dl||0;x.c++});const r=Object.values(m).sort((a,b)=>(b.l*3+b.d)-(a.l*3+a.d)).slice(0,10);return`<div class="box"><h3>🏆 Top Kreator</h3>${r.map((x,i)=>`<div class="row" style="margin:10px 0"><b class="px" style="width:34px">${['🥇','🥈','🥉'][i]||i+1}</b><div style="flex:1">${uname(x.n)}<div class="muted">${x.c} info · ❤ ${x.l} · ⬇ ${x.d}</div></div></div>`).join('')||'<div class="empty">Belum ada data.</div>'}</div>`}
function home(){const l=list(),vers=[...new Set(S.posts.map(p=>p.gver).filter(Boolean))];
 const tabs=`<div class="tabs">${TABS.map(([k,n])=>`<button class="tab ${S.tab===k?'on':''}" data-act="tab" data-id="${k}">${n}</button>`).join('')}</div>`;
 if(S.tab==='top')return tabs+topPage();
 const so=[['new','Terbaru'],['hot','Terpopuler'],['dl','Terbanyak download'],['like','Terbanyak like']];
 return tabs+`<input id="q" placeholder="🔍 Cari judul, deskripsi, atau #tag..." value="${E(S.q)}" data-q="1"><div class="row" style="margin-bottom:14px"><select data-f="sort" style="width:auto;margin:0">${so.map(([v,t])=>`<option value="${v}" ${S.sort===v?'selected':''}>${t}</option>`).join('')}</select><select data-f="ver" style="width:auto;margin:0"><option value="">🎮 Semua versi</option>${vers.map(v=>`<option ${S.ver===v?'selected':''}>${E(v)}</option>`).join('')}</select></div>${uhits()}${l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<div class="empty">${S.tab==='saved'&&!S.me?'Masuk untuk melihat info tersimpan.':S.tab==='follow'?(S.me?'Ikuti kreator dulu untuk melihat info mereka di sini.':'Masuk untuk melihat info dari kreator yang kamu ikuti.'):'Belum ada info.'}</div>`}`}
function upload(){const d=S.draft;return`<div class="box"><h3>${S.edit?'Edit Info':'Tambah Info'}</h3>
<label>Judul</label><input data-k="title" value="${E(d.title)}">
<label>Deskripsi</label><textarea rows="4" data-k="desc">${E(d.desc)}</textarea>
<label>Kategori</label><select data-k="cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${d.cat===k?'selected':''}>${v}</option>`).join('')}</select>
<label>Thumbnail</label>${d.thumb?`<div class="th" style="background-image:url('${E(d.thumb)}');border-radius:10px;margin:4px 0"></div>`:''}<input type="file" accept="image/*" data-act-change="thumb">
<label>Versi game</label><input data-k="gver" maxlength="12" placeholder="mis. 1.21 / Bedrock" value="${E(d.gver)}"><label>Tag (pisahkan spasi, maks 5)</label><input data-k="tags" placeholder="survival pvp texture" value="${E(d.tags)}"><label>Sosial media (opsional)</label>${SOC.map(([k,i,n])=>`<input data-k="s_${k}" placeholder="${i} Link ${n}" value="${E(d['s_'+k])}">`).join('')}
<label>Link download</label><input data-k="link" placeholder="https://..." value="${E(d.link)}">
${assets?`<label>Atau upload file langsung (maks 50 MB)</label><input type="file" data-act-change="file">${d.fileName?`<div class="muted">✔ ${E(d.fileName)}</div>`:''}`:'<div class="muted" style="margin-bottom:10px">Upload file langsung hanya tersedia bila disediakan pemilik web; gunakan link.</div>'}
<label><input type="checkbox" data-kc="vip" ${d.vip?'checked':''} style="width:auto;margin:0 6px 10px 0">🔒 Konten VIP (hanya bisa diakses pengguna VIP)</label>
<div class="err" style="color:#e11d48">${E(S.err)}</div>
<div class="row"><button class="pri" data-act="savepost">${S.edit?'Simpan Perubahan':'Publikasikan'}</button>${S.edit?'<button data-act="cancel">Batal</button>':''}</div></div>`}
function profile(){const u=me();if(!u)return`<div class="box empty">Kamu belum masuk.<br><br><button class="pri" data-act="auth">Masuk / Daftar</button></div>`;
 const mine=S.posts.filter(p=>p.author===S.me);
 return`<div class="box prof"><div class="pb"></div><div class="row big" style="margin-top:-32px">${av(S.me)}</div><h2 style="margin:10px 0 4px">${E(dn(S.me))}</h2><div class="muted">@${E(S.me)} ${tagOf(S.me)}</div><p>${E(u.bio||'Belum ada bio.')}</p><div class="mt">📅 ${ago(u.created)} · 📦 ${mine.length} info · ❤ ${mine.reduce((a,p)=>a+(p.likes||[]).length,0)}</div><div class="mt" style="margin-top:6px">👥 ${S.fcount[S.me]||0} pengikut · ➡ ${S.gcount[S.me]||0} mengikuti</div><div class="row" style="margin-top:10px"><button class="pri" data-act="nav" data-id="wallet">💰 Saldo & VIP</button><button data-act="nav" data-id="find">🔍 Cari Pengguna</button><button data-act="nav" data-id="settings">⚙️ Pengaturan</button></div></div>
<h3>Info saya (mode edit)</h3>${mine.length?mine.map(p=>`<div class="box row"><div style="flex:1"><b>${E(p.title)}</b><div class="muted">❤ ${(p.likes||[]).length} · 👁 ${p.views||0}</div></div><button class="sm" data-act="editpost" data-id="${p.id}">Edit</button><button class="sm dng" data-act="delpost" data-id="${p.id}">Hapus</button></div>`).join(''):'<div class="muted">Belum ada.</div>'}

function uhits(){const q=S.q.trim().toLowerCase().replace(/^@/,'');if(!q||q[0]==='#')return'';const r=Object.keys(S.users).filter(n=>(n+' '+dn(n)).toLowerCase().includes(q)).slice(0,4);return r.length?`<h3>👤 Pengguna</h3>${r.map(userRow).join('')}<h3>📦 Info</h3>`:''}
function findPage(){const q=S.fq.toLowerCase().replace(/^@/,'');let l=Object.keys(S.users);
 if(S.ft==='following')l=l.filter(n=>S.following.includes(n));if(S.ft==='followers')l=l.filter(n=>S.followers.includes(n));
 if(q)l=l.filter(n=>(n+' '+dn(n)).toLowerCase().includes(q));l.sort((a,b)=>(S.fcount[b]||0)-(S.fcount[a]||0));
 return`<h3>🔍 Cari Pengguna</h3><input id="fq" placeholder="Cari username atau nama..." value="${E(S.fq)}" data-fq="1"><div class="tabs">${[['all','Semua'],['following','Mengikuti'],['followers','Pengikut']].map(([k,t])=>`<button class="tab ${S.ft===k?'on':''}" data-act="ft" data-id="${k}">${t}</button>`).join('')}</div><div class="muted" style="margin-bottom:10px">💡 Untuk chat, kalian harus saling follow (tekan <b>Ikuti balik</b> kalau dia sudah mengikutimu). Admin &amp; Owner bisa dichat siapa saja.</div>${l.length?l.map(userRow).join(''):'<div class="empty">Tidak ada pengguna.</div>'}`}
function gatem(){return`<div class="bg" data-act="bg"><div class="md"><div class="mh"><b>🔒 Konten VIP</b><button class="sm" data-act="close">✕</button></div><div class="mb" style="text-align:center"><p>Info ini khusus pengguna <b>VIP</b>. Beli paket VIP dari saldo untuk membukanya.</p><div class="row" style="justify-content:center">${S.me?'<button class="pri" data-act="nav" data-id="wallet">⭐ Beli VIP</button>':'<button class="pri" data-act="auth">Masuk dulu</button>'}<button data-act="close">Tutup</button></div></div></div></div>`}
function render(force){if(!force&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')){dirty=true;return}dirty=false;const ms=document.querySelector('.mb'),st=ms?ms.scrollTop:0,fx=S.anim;S.anim=false;
 const pg=S.page,nb=[['home','🏠','Utama'],['chat','💬','Chat'],['upload','➕','Upload'],['notif','🔔','Notif'],['profile','👤','Profil']];
 document.getElementById('app').innerHTML=`<header><div class="brand"><img src="/logo.svg" alt="" style="width:28px;height:28px;vertical-align:middle;margin-right:8px;border-radius:7px">Meon Hall Share</div><button data-act="nav" data-id="donate">💝</button>${S.me&&me()?`${S.mine?`<button data-act="nav" data-id="wallet">💰 ${rk(S.mine.balance)}</button>`:''}<button data-act="nav" data-id="profile">👤</button>`:`<button data-act="auth">Masuk</button><button class="pri" data-act="authup">Daftar</button>`}</header>
<div class="stats"><div class="stat"><b><span class="dot"></span>${S.peers}</b><span>Online</span></div><div class="stat"><b>${S.visits}</b><span>Total pengunjung</span></div><div class="stat"><b>${S.posts.length}</b><span>Info</span></div></div>
<main>${S.myBan>Date.now()?`<div class="box" style="border-color:#e11d48">🚫 ${S.myBan>=8e15?'Akunmu diblokir permanen.':'Akunmu diblokir sampai '+new Date(S.myBan).toLocaleString('id-ID')+'.'} Kamu hanya bisa melihat.</div>`:''}${S.dbOk===false?`<div class="box">Server tidak merespons. Periksa pengaturan Supabase/Vercel lalu muat ulang.${S.dbErr?`<br><small>Detail: ${E(S.dbErr)}</small>`:''}</div>`:''}${pg==='home'?home():pg==='upload'?(S.me&&me()?upload():profile()):pg==='profile'?profile():pg==='user'?userPage():pg==='chat'?chat():pg==='notif'?notifPage():pg==='donate'?donate():pg==='wallet'?wallet():pg==='find'?findPage():settings()}</main>
<nav class="bot">${nb.map(([k,i,n])=>`<button class="${pg===k?'on':''}" data-act="nav" data-id="${k}"><span>${i}${k==='notif'&&S.unreadN?`<i class="nbd">${S.unreadN}</i>`:''}${k==='chat'&&S.unreadM?`<i class="nbd">${S.unreadM}</i>`:''}</span>${n}</button>`).join('')}</nav>${S.open?detail():''}${S.modal==='auth'?authm():''}${S.modal==='proof'?proofm():''}${S.modal==='gate'?gatem():''}`;
 document.getElementById('app').className=fx?'fx':'';const nb2=document.querySelector('.mb');if(nb2)nb2.scrollTop=S.scrollEnd?nb2.scrollHeight:st;S.scrollEnd=false;
 const q=document.querySelector('#q,#fq');if(q&&force==='q'){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
const val=id=>document.getElementById(id)?.value||'';
function shrink(f,mx){return new Promise(r=>{const i=new Image();i.onload=()=>{const m=mx||640,k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.75)};i.src=URL.createObjectURL(f)})}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.fq){S.fq=t.value;render('q')}if(t.id==='pamt')S.pamt=t.value;if(t.id==='tamt')S.topAmt=t.value;if(t.id==='ctext')S.ctext=t.value;if(t.id==='mtext')S.mtext=t.value;if(t.dataset.k)S.draft[t.dataset.k]=t.value;if(t.dataset.q){S.q=t.value;render('q')}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(dirty)render()},150));
async function api(action,body){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action,...body})});let j={};try{j=await r.json()}catch(e){}if(!r.ok){const d=j.detail||j.error||('HTTP '+r.status);S.dbErr=d;throw new Error(j.error||'Server error ('+r.status+')')}return j}
async function sync(){const j=await api('state');S.users=j.users;S.posts=j.posts;S.comments=j.comments;S.me=j.me;S.saves=j.me?{[j.me]:{ids:j.saves}}:{};S.peers=j.peers;S.visits=j.visits;S.myBan=j.myBan||0;S.mine=j.mine;S.packages=j.packages||[];S.txns=j.txns||[];S.mytops=j.mytops||[];S.pend=j.pend||[];S.following=j.following||[];S.followers=j.followers||[];S.fcount=j.fcount||{};S.gcount=j.gcount||{};S.notifs=j.notifs||[];S.unreadN=j.unreadN||0;S.unreadM=j.unreadM||0;S.reports=j.reports||[];S.dbOk=true;render()}
async function getSb(){if(!sb){const c=await api('config'),m=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');sb=m.createClient(c.url,c.anon)}return sb}
async function up(file,kind,name,type){const j=await api('signupload',{kind,name}),c=await getSb(),r=await c.storage.from(j.bucket||'uploads').uploadToSignedUrl(j.path,j.token,file,{contentType:type||'application/octet-stream'});if(r.error)throw r.error;return kind==='proof'?j.path:j.url}
document.addEventListener('change',async e=>{const t=e.target,a=t.dataset.actChange,f=t.files?.[0];if(t.id==='aon'||t.id==='apkg'){const m=S.mine||{};S.ad=S.ad||{on:!!m.autoRenew,pkg:m.autoPkg||(S.packages[0]||{}).id};if(t.id==='aon')S.ad.on=t.checked;else S.ad.pkg=t.value;return}if(t.dataset.f){S[t.dataset.f]=t.value;S.anim=true;render(true);return}if(t.dataset.kc){S.draft[t.dataset.kc]=t.checked;return}if(!a||!f)return;
 try{S.err='Mengunggah...';render(true);
 if(a==='thumb')S.draft.thumb=await up(await shrink(f),'thumb','a.jpg','image/jpeg');
 if(a==='proof'){S.topProof=await up(await shrink(f,1280),'proof','p.jpg','image/jpeg')}if(a==='file'){S.draft.fileUrl=await up(f,'file',f.name,f.type);S.draft.fileName=f.name}
 if(a==='avatar'){const u=await up(await shrink(f),'thumb','a.jpg','image/jpeg');await api('saveavatar',{url:u});await sync()}
 S.err=''}catch(x){S.err='Gagal upload: '+(x.message||'')}render(true)});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id;
 if(a==='bg'&&e.target!==t)return;if(a!=='dl'&&a!=='noreply')e.preventDefault();if(a==='noreply')e.preventDefault();
 try{await act(a,id)}catch(x){S.err='Terjadi kesalahan: '+(x.message||x.code||'');render(true)}});
async function act(a,id){
 if(a==='nav'){S.anim=true;S.open=null;S.modal=null;S.page=id;S.err='';if(id==='wallet'&&!need())return;if(id==='chat'){S.cu=null;if(!need())return;await loadInbox();return}if(id==='notif'){if(!need())return;S.notifNew=new Set(S.notifs.filter(n=>!n.read).map(n=>n.id));api('readnotifs').then(sync).catch(()=>{})}S.err='';if(id==='upload'&&!S.edit)S.draft={cat:'addon'};if(id==='upload'&&!need())return;render(true);scrollTo(0,0);return}
 else if(a==='tab'){S.tab=id;S.anim=true}
 else if(a==='auth'||a==='authup'){S.anim=true;S.modal='auth';S.mode=a==='auth'?'in':'up';S.err=''}
 else if(a==='swap'){S.mode=S.mode==='up'?'in':'up';S.err=''}
 else if(a==='close'||a==='bg'){S.modal=null;S.open=null;S.reply=null;S.err=''}
 else if(a==='open'){const lp=S.posts.find(x=>x.id===id);if(lp&&lp.locked){S.modal='gate';S.anim=true;render(true);return}S.open=id;S.anim=true;api('view',{id}).then(sync).catch(()=>{})}
 else if(a==='signup'||a==='signin'){const u=val('au').trim().toLowerCase(),p=val('ap');
  try{await api(a,{u,p,d:val('ad')});S.modal=null;S.err='';await sync()}catch(x){S.err=x.message}}
 else if(a==='out'){await api('signout');S.page='home';await sync()}
 else if(a==='like'||a==='save'||a==='delc'||a==='delpost'){if(!need())return;if(a==='delpost'){if(!confirm('Hapus info ini?'))return;S.open=null}await api(a,{id});await sync()}
 else if(a==='dl'){if(!S.me){event.preventDefault();need();return}api('dl',{id}).then(sync).catch(()=>{});return}
 else if(a==='reply'){if(!need())return;S.reply=id;render(true);document.getElementById('ctext')?.focus();return}
 else if(a==='noreply'){S.reply=null}
 else if(a==='comment'){if(!need())return;const tx=val('ctext').trim();if(!tx)return;await api('comment',{pid:id,text:tx,reply:S.reply||''});S.reply=null;S.ctext='';S.scrollEnd=true;await sync()}
 else if(a==='savepost'){if(!need())return;const d=S.draft;if(!(d.title||'').trim())return S.err='Judul wajib diisi',render(true);
  if(!d.link&&!d.fileUrl)return S.err='Isi link atau upload file',render(true);
  const body={id:S.edit||'',title:d.title,desc:d.desc,cat:d.cat,thumb:d.thumb,link:d.link,fileUrl:d.fileUrl,vip:!!d.vip,tags:d.tags||'',gver:d.gver||''};SOC.forEach(([k])=>body['s_'+k]=d['s_'+k]);
  try{await api('savepost',body);S.edit=null;S.draft={cat:'addon'};S.err='';S.page='home';S.tab='new';await sync()}catch(x){S.err=x.message}}
 else if(a==='user'){S.open=null;S.modal=null;S.anim=true;if(id===S.me)S.page='profile';else{S.vu=id;S.page='user'}scrollTo(0,0)}
 else if(a==='follow'){if(!need())return;await api('follow',{u:id});await sync()}
 else if(a==='dm'){if(!need())return;if(!canChat(id)&&!S.convs.some(c=>c.u===id)){alert('Untuk chat, kalian harus saling follow dulu.');return}S.anim=true;S.page='chat';S.cu=id;S.open=null;S.thread=[];S.mtext='';render(true);await loadThread(true);return}
 else if(a==='back'){S.cu=null;await loadInbox();return}
 else if(a==='send'){if(!need())return;const tx=val('mtext').trim();if(!tx)return;await api('send',{to:S.cu,body:tx});S.mtext='';const el=document.getElementById('mtext');if(el)el.value='';await loadThread(false,true);return}
 else if(a==='tag'){S.q='#'+id;S.page='home';S.tab='new';S.open=null;S.anim=true;scrollTo(0,0)}
 else if(a==='pinpost'){const p=S.posts.find(x=>x.id===id);await api('pinpost',{id,pinned:!p.pinned});await sync()}
 else if(a==='report'||a==='reportc'){if(!need())return;const r=prompt('Alasan laporan (mis. spam, tidak pantas, link berbahaya):');if(r===null)return;const c=a==='reportc'?S.comments.find(x=>x.id===id):null;await api('report',{pid:c?c.pid:id,cid:c?c.id:'',reason:r});alert('Laporan terkirim. Terima kasih 🙏');return}
 else if(a==='resolve'){await api('resolve',{id});await sync()}
 else if(a==='buyvip'){if(!need())return;const p=S.packages.find(x=>x.id===id);if(!p||!confirm(`Beli ${p.label} seharga ${rp(p.price)} dari saldo?`))return;await api('buyvip',{pkg:id});alert('VIP aktif ✔ Selamat menikmati!');await sync()}
 else if(a==='saveauto'){const m=S.mine||{},ad=S.ad||{on:!!m.autoRenew,pkg:m.autoPkg||(S.packages[0]||{}).id};await api('setauto',{on:ad.on,pkg:ad.pkg});S.ad=null;await sync();alert(ad.on?'Bayar otomatis diaktifkan.':'Bayar otomatis dinonaktifkan.')}
 else if(a==='sendtop'){if(!need())return;await api('topup',{amount:Number(S.topAmt),path:S.topProof});S.topAmt='';S.topProof='';await sync();alert('Terkirim ✔ Admin akan meninjau bukti pembayaranmu.')}
 else if(a==='review'){S.pid=Number(id);const t=S.pend.find(x=>x.id===S.pid);S.pamt=String(t?t.claimed:'');S.purl='';S.modal='proof';S.anim=true;render(true);const j=await api('proofurl',{id});S.purl=j.url;render(true);return}
 else if(a==='approve'||a==='reject'){if(a==='approve'&&!(Number(S.pamt)>0))return alert('Isi nominal sesuai bukti');if(!confirm(a==='approve'?`Beri saldo ${rp(S.pamt)} ke pengguna ini? Bukti akan dihapus.`:'Tolak top up ini? Bukti akan dihapus.'))return;await api('reviewtopup',{id:S.pid,approve:a==='approve',amount:Number(S.pamt)});S.modal=null;S.purl='';await sync()}
 else if(a==='vipgate'){S.modal='gate';S.anim=true}
 else if(a==='ft'){S.ft=id}
 else if(a==='nochat'){alert('Untuk chat, kalian harus saling follow dulu. Ikuti dia, lalu tunggu dia mengikutimu balik.');return}
 else if(a==='hidepost'){const p=S.posts.find(x=>x.id===id);await api('admpost',{id,hidden:!p.hidden});await sync()}
 else if(a==='editpost'){const p=S.posts.find(x=>x.id===id);S.edit=id;S.open=null;S.draft={...p,tags:(p.tags||[]).join(' ')};S.page='upload';S.err=''}
 else if(a==='cancel'){S.edit=null;S.draft={cat:'addon'};S.page='profile'}
 else if(a==='savetag'){await api('savetag',{u:id,tagText:val('tt_'+id),tagColor:val('tc_'+id),role:document.getElementById('tr_'+id)?val('tr_'+id):'',vipDays:val('tv_'+id),banMin:val('tb_'+id)});await sync()}
 else if(a==='savebio'){await api('savebio',{bio:val('bio'),display:val('dn')});S.err='';await sync()}
 else if(a==='chpw'){try{await api('chpw',{old:val('pw1'),new:val('pw2')});S.err='Password diganti ✔'}catch(x){S.err=x.message}}
 render(true)}
async function init(){render(true);
 try{await sync()}catch(e){S.dbOk=false;return render(true)}
 try{if(!sessionStorage.getItem('mhs_v')){sessionStorage.setItem('mhs_v','1');api('visit').then(sync).catch(()=>{})}}catch(e){}
 const beat=()=>api('beat',{sid}).catch(()=>{});beat();setInterval(beat,30000);setInterval(()=>sync().catch(()=>{}),15000);setInterval(()=>{if(S.page==='chat'&&S.me){S.cu?loadThread(false).catch(()=>{}):loadInbox().catch(()=>{})}},6000);try{navigator.serviceWorker&&navigator.serviceWorker.register('/sw.js')}catch(e){}}
init();
</script></body></html>
